name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "ubuntu · py3.10 · trexio",       os: ubuntu-latest, python: "3.10", trexio: "true",  qmckl_flags: "" }
          - { label: "ubuntu · py3.12 · trexio",       os: ubuntu-latest, python: "3.12", trexio: "true",  qmckl_flags: "" }
          - { label: "macos-latest · py3.12 · trexio", os: macos-latest,  python: "3.12", trexio: "true",  qmckl_flags: "" }
          - { label: "ubuntu · py3.12 · no-trexio",    os: ubuntu-latest, python: "3.12", trexio: "false", qmckl_flags: "--without-trexio" }
    env:
      QMCKL_VERSION: "1.1.0"
      QMCKL_SHA256: "3e1d957a570dd8b05d9a58250520fc9817afb50ab1b4d412becde85bd1029e3e"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Conda environment (TREXIO, HDF5, gfortran)
        id: conda
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qmckl-env
          micromamba-root-path: ${{ github.workspace }}/.mamba
          create-args: >-
            -c conda-forge
            trexio hdf5 gfortran openblas
          cache-environment: true

      - name: Restore the QMCkl prefix
        id: qmckl-cache
        uses: actions/cache@v6
        with:
          path: qmckl
          key: qmckl-${{ env.QMCKL_VERSION }}-${{ runner.os }}-${{ runner.arch }}-trexio-${{ matrix.trexio }}

      - name: Build QMCkl ${{ env.QMCKL_VERSION }}
        if: steps.qmckl-cache.outputs.cache-hit != 'true'
        env:
          ENV_PREFIX: ${{ steps.conda.outputs.environment-path }}
          QMCKL_FLAGS: ${{ matrix.qmckl_flags }}
        run: |
          set -euo pipefail
          curl -sSL -o qmckl.tar.gz \
            "https://github.com/TREX-CoE/qmckl/releases/download/v${QMCKL_VERSION}/qmckl-${QMCKL_VERSION}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  qmckl.tar.gz\n' "${QMCKL_SHA256}" | sha256sum -c -
          else
            printf '%s  qmckl.tar.gz\n' "${QMCKL_SHA256}" | shasum -a 256 -c -
          fi
          tar xzf qmckl.tar.gz
          cd "qmckl-${QMCKL_VERSION}"
          export PATH="${ENV_PREFIX}/bin:${PATH}"
          export FC="${ENV_PREFIX}/bin/gfortran"
          if [ -n "${QMCKL_FLAGS}" ]; then
            ./configure --prefix="${GITHUB_WORKSPACE}/qmckl" --without-openmp \
              --with-blas="-L${ENV_PREFIX}/lib -lopenblas" \
              --with-lapack="-L${ENV_PREFIX}/lib -lopenblas" \
              ${QMCKL_FLAGS}
          else
            ./configure --prefix="${GITHUB_WORKSPACE}/qmckl" --without-openmp \
              --with-blas="-L${ENV_PREFIX}/lib -lopenblas" \
              --with-lapack="-L${ENV_PREFIX}/lib -lopenblas" \
              --with-trexio="${ENV_PREFIX}"
          fi
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      - name: Point pkg-config and the loader at QMCkl
        run: |
          set -euo pipefail
          ENV_PREFIX="${{ steps.conda.outputs.environment-path }}"
          echo "PKG_CONFIG_PATH=${GITHUB_WORKSPACE}/qmckl/lib/pkgconfig:${ENV_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/qmckl/lib:${ENV_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/qmckl/lib:${ENV_PREFIX}/lib" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/qmckl/lib/pkgconfig:${ENV_PREFIX}/lib/pkgconfig"
          if ! ver=$(pkg-config --modversion qmckl); then
            echo "qmckl.pc not found or unreadable (PKG_CONFIG_PATH=${PKG_CONFIG_PATH})" >&2
            exit 1
          fi
          echo "qmckl ${ver}"

      - name: Install the package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core cmake ninja numpy pytest
          python -m pip install -e . --no-build-isolation

      - name: TREXIO is bound exactly when the library has TREXIO support
        env:
          EXPECT_TREXIO: ${{ matrix.trexio }}
        run: |
          set -euo pipefail
          python -c 'import os, qmckl; bound = hasattr(qmckl, "trexio_read"); want = os.environ["EXPECT_TREXIO"] == "true"; assert bound is want, f"trexio_read bound={bound}, expected {want}"'

      - name: Test
        run: python -m pytest -q
