[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "qmckl-python"
version = "0.1.0"
description = "Python bindings for QMCkl, generated with nanobind"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Anthony Scemama" }]
keywords = ["quantum Monte Carlo", "QMC", "QMCkl", "nanobind"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/TREX-CoE/qmckl-python"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/qmckl"]
sdist.include = ["csrc", "CMakeLists.txt", "PLAN.md", "LICENSE"]
# The bindings are generated from the *installed* qmckl.h, so never cache a
# build directory across different QMCkl installations.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
